apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-web-app
  template:
    metadata:
      labels:
        app: my-web-app
    spec:
      containers:
      - name: my-web-app
        # GitHub Actions замінить цей рядок на реальну назву образу
        image: ghcr.io/USERNAME/REPO_NAME:latest 
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: "devops-lab-db-host" # Тут буде адреса бази
---
apiVersion: v1
kind: Service
metadata:
  name: my-web-app-service
spec:
  type: LoadBalancer
  selector:
    app: my-web-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080